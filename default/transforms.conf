# ---- v0.5.9 ----
# Future-dated logs from the resolved uhgid-000024 timestamp/sourcetype DQ issue.
# Core Splunk will not delete them, so they age out on their own (latest timestamp June 2027).
# ignore_scope=pair -> junk sourcetype, the whole index+sourcetype pair is dropped from shadow
#                      and discovery results.
# ignore_scope=future_events_only -> real sourcetype that still carries good data; the pair is
#                      kept, and only its future-dated events are dropped by `dc_indexed_within`.
# Git-managed. Rows can be removed once latest_future_epoch has passed.
[dc_future_logs_ignore]
filename = dc_future_logs_ignore_seed.csv

