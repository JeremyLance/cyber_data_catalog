# ============================================================
# Lookup definitions over the catalog KV Store collections
# ============================================================

[dc_datasets_lookup]
external_type = kvstore
collection = dc_datasets
fields_list = _key, dataset_id, uhgid, ae_name, index, sourcetype, domain, cim_datamodel, tenant_type, declared_tier, proposed_tier, business_owner, technical_owner, content_owner, backup_owner, gate1_normalization, gate2_detection, gate3_soc, cde_priority, enterprise_ready, schema_version, contract_status, compliance_flags, status, retention_days, pipeline, environment, last_reviewed, lifecycle_state, migration_state, value_score, notes

[dc_uf_nodes_lookup]
external_type = kvstore
collection = dc_uf_nodes
fields_list = _key, uf_id, uf_host, connects_via_hf, connects_via_hf_id, uhgid, declared_tier, tier_rationale, technical_owner, status, lifecycle_state, first_seen, last_seen, notes

[dc_contracts_lookup]
external_type = kvstore
collection = dc_contracts
fields_list = _key, dataset_id, tier, schema_version, expected_events_min, expected_events_max, max_silence_minutes, max_latency_seconds, sla_response_minutes, notify_channel, approved_by, approved_date, contract_url

[dc_schema_fields_lookup]
external_type = kvstore
collection = dc_schema_fields
fields_list = _key, sourcetype, schema_version, field_name, cim_field, data_type, required, min_coverage_pct, sensitivity, description, example

[dc_schema_versions_lookup]
external_type = kvstore
collection = dc_schema_versions
fields_list = _key, sourcetype, schema_version, change_date, change_type, fields_added, fields_removed, approver, change_ticket

[dc_ko_lookup]
external_type = kvstore
collection = dc_knowledge_objects
fields_list = _key, ko_id, ko_name, ko_type, app, author, ko_tier, owner, requesting_team, mitre_technique, github_repo, enabled, is_scheduled, cron_schedule, last_seen_in_rest, run_count_30d, doc_url

[dc_dependencies_lookup]
external_type = kvstore
collection = dc_dependencies
fields_list = _key, ko_id, ko_type, dep_type, dep_value, dataset_id, discovery_method, confidence, last_discovered

[dc_observed_lookup]
external_type = kvstore
collection = dc_observed
fields_list = _key, feed_id, dataset_id, index, sourcetype, last_seen, events_24h, bytes_24h, hosts_24h, field_fingerprint, first_observed

[dc_baselines_lookup]
external_type = kvstore
collection = dc_baselines
fields_list = _key, dataset_id, median_events, mad_events, p05_events, p95_events, days_sampled, updated

