# Summary index for catalog trending. On Splunk Cloud, create this via the
# Cloud admin UI instead of shipping indexes.conf in the app.
[summary_datacatalog]
homePath   = $SPLUNK_DB/summary_datacatalog/db
coldPath   = $SPLUNK_DB/summary_datacatalog/colddb
thawedPath = $SPLUNK_DB/summary_datacatalog/thaweddb
frozenTimePeriodInSecs = 63072000
