[DC - 98 - Discover HF/EP candidates]
description = Proposes hosts that LOOK like an HF or EP - never writes directly into dc_infra_nodes. Drift-detection only, not bootstrap discovery. Two fixes: (1) fwdType is a search-time field, not indexed - tstats returned nothing for it, so EP branch now uses search+stats like DC-90/00e; (2) join (not lookup) against a computed host_short on both sides, since dc_infra_nodes_lookup has no stored host_short field.
search = search `dc_scope_indexes` fwdType=edge earliest=-24h | stats count as events_seen, min(_time) as first_seen, max(_time) as last_seen by host | eval candidate_id="ep|".host, suspected_type="edge_processor", evidence="host presented fwdType=edge on indexed events", confidence="high (direct field observation)" | eval host_short=lower(mvindex(split(host,"."),0)) | join type=left host_short [ | inputlookup dc_infra_nodes_lookup | eval host_short=lower(mvindex(split(host,"."),0)) | fields node_id, host_short | rename node_id as already_registered ] | where isnull(already_registered) | eval uhgid_guess=if(match(host,"uhgid-\d+"), replace(host,".*?(uhgid-\d+).*","\1"), "unresolved") | eval _key=candidate_id, discovered=now(), status="pending_review" | table _key candidate_id host suspected_type evidence confidence uhgid_guess first_seen last_seen events_seen discovered status | outputlookup append=t dc_infra_candidates_lookup | append [ search index=_internal source=*tcpin_connections* connectionType=cooked earliest=-24h | stats count as events_seen, min(_time) as first_seen, max(_time) as last_seen, values(sourceHost) as forwarders_seen by hostname | eval candidate_id="hf|".hostname, host=hostname, suspected_type="heavy_forwarder", evidence="Received cooked TCP connections from ".mvcount(forwarders_seen)." forwarder(s)", confidence="medium" | eval host_short=lower(mvindex(split(host,"."),0)) | join type=left host_short [ | inputlookup dc_infra_nodes_lookup | eval host_short=lower(mvindex(split(host,"."),0)) | fields node_id, host_short | rename node_id as already_registered ] | where isnull(already_registered) | eval uhgid_guess=if(match(host,"uhgid-\d+"), replace(host,".*?(uhgid-\d+).*","\1"), "unresolved") | eval _key=candidate_id, discovered=now(), status="pending_review" | table _key candidate_id host suspected_type evidence confidence uhgid_guess first_seen last_seen events_seen discovered status ] | outputlookup append=t dc_infra_candidates_lookup
