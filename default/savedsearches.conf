description = Guards against the KV Store overwrite failure mode. Alerts if dc_datasets loses rows, if records lose their core identity fields, or if a dataset in the seed file is missing from the collection. Enable this before any other writer search.
search = | inputlookup dc_datasets_lookup | stats count as kv_rows, sum(eval(if(isnull(sourcetype) OR sourcetype="",1,0))) as missing_sourcetype, sum(eval(if(isnull(index) OR index="",1,0))) as missing_index, sum(eval(if(isnull(uhgid) OR uhgid="",1,0))) as missing_uhgid | appendcols [ | inputlookup dc_datasets_seed.csv | stats count as seed_rows ] | eval drift=seed_rows-kv_rows | eval finding=case(kv_rows=0,"CATALOG EMPTY - run DC-00 to seed it", missing_sourcetype>0 OR missing_index>0 OR missing_uhgid>0,"RECORDS TRUNCATED - a writer search overwrote records instead of merging. Re-run DC-00.", drift>0,"SEED ROWS MISSING FROM COLLECTION - run DC-00", 1=1,"ok") | where finding!="ok" | table finding kv_rows seed_rows drift missing_sourcetype missing_index missing_uhgid
