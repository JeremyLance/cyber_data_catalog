[DC - 90 - Infra node heartbeat and health (registry-driven, all types)]
description = Heavy Forwarder heartbeat and health, driven off traffic-proxy signals (hf_thruput, queue, tcpout/tcpin). Edge Processor heartbeat is now owned by DC-92 (OTel self-metrics, index=_metrics) - confirmed 2026-10-21 as faster and independent of the 9997 data path, unlike the fwdType=edge/generic-eventflow signals this search used to rely on for EP. Scoped to node_type!="Edge Processor" and switched to the merge-safe inputlookup/append/stats latest(*) pattern (previously a bare outputlookup, which was fully overwriting the collection every run and clobbering DC-92's EP rows).
search = search index=_internal source=*metrics.log group=per_host_thruput earliest=-1h | stats sum(kb) as kb_thruput, avg(eps) as avg_events_per_sec_1h, max(_time) as last_seen_hf by host | eval signal_type="hf_thruput" | append [ search index=_internal source=*metrics.log group=queue earliest=-1h | stats max(current_size_kb) as max_queue_kb, sum(blocked_count) as events_blocked_1h, max(_time) as last_seen_queue by host ] | append [ search index=_internal source=*metrics.log group=tcpout_connections earliest=-1h | stats max(_time) as last_seen_tcpout by host ] | append [ search index=_internal source=*metrics.log group=tcpin_connections host!="idx*" earliest=-15m | stats dc(sourceIp) as connected_forwarders by host ] | append [| tstats count as events_1h, max(_time) as last_seen_generic where `dc_scope_indexes` earliest=-1h by host | eval signal_type="generic_eventflow" ] | eval host_short=lower(mvindex(split(host,"."),0)) | stats values(signal_type) as signals_seen, sum(kb_thruput) as kb_thruput, max(avg_events_per_sec_1h) as avg_events_per_sec_1h, max(last_seen_hf) as last_seen_hf, max(max_queue_kb) as max_queue_kb, max(last_seen_queue) as last_seen_queue, sum(events_blocked_1h) as events_blocked_1h, max(last_seen_tcpout) as last_seen_tcpout, max(connected_forwarders) as connected_forwarders, max(last_seen_generic) as last_seen_generic by host_short | join type=inner host_short [| inputlookup dc_infra_nodes_lookup where status="active" AND node_type!="Edge Processor" | eval host_short=lower(mvindex(split(host,"."),0)) | fields node_id, node_type, host_short ] | eval last_heartbeat=coalesce(last_seen_hf,last_seen_queue,last_seen_generic) | eval heartbeat_source=case(isnotnull(last_seen_hf),"primary (hf_thruput)", isnotnull(last_heartbeat),"fallback (generic event flow)",1=1,"none") | eval uptime_status=case(isnull(last_heartbeat),"never", now()-last_heartbeat<3600,"reporting",1=1,"stale") | eval throughput_gb=round(coalesce(kb_thruput,0)/1024/1024,2), throughput_kbps=round(coalesce(kb_thruput,0)/3600,2) | eval max_queue_pct=if(isnotnull(max_queue_kb),round(max_queue_kb/`dc_queue_capacity_kb`*100,1),null()) | eval queue_status=case(events_blocked_1h>0,"blocked", max_queue_pct>90,"backing_up", isnull(max_queue_kb),"unknown", 1=1,"normal") | eval connected_to_cloud=if(isnotnull(last_seen_tcpout),"yes","no") | eval health_score=case(connected_to_cloud="no",0, events_blocked_1h>0,25, max_queue_pct>90,50, isnotnull(last_heartbeat) AND uptime_status="reporting",100, isnotnull(last_heartbeat),75, 1=1,null()) | eval _key=node_id, checked=now() | table _key node_id node_type last_heartbeat uptime_status heartbeat_source signals_seen queue_status max_queue_pct max_queue_kb throughput_gb throughput_kbps avg_events_per_sec_1h connected_forwarders health_score connected_to_cloud events_blocked_1h checked | append [| inputlookup dc_infra_observed_lookup ] | eval merge_key=_key | dedup merge_key | fields - merge_key | outputlookup dc_infra_observed_lookup
