[DC - 74 - Payload shape change (silent format drift)]
description = Fires when bytes-per-event moves outside baseline while event count stays normal. Catches upstream format changes, dropped fields and truncation that every count-based check passes.
search = index=_internal source=*license_usage.log type=Usage earliest=-24h | eval index=coalesce(idx,index), sourcetype=coalesce(st,sourcetype) | stats sum(b) as bytes_24h by index, sourcetype | `dc_key` | `dc_index_family` | join type=left index sourcetype [| tstats count as events_24h where `dc_scope_indexes` earliest=-24h by index, sourcetype] | eval bytes_per_event=if(events_24h>0,bytes_24h/events_24h,null()), gb_24h=round(bytes_24h/1024/1024/1024,3) | lookup dc_volume_baselines_lookup dataset_id OUTPUT median_bytes_per_event, mad_bytes_per_event, median_gb_day, mad_gb_day | where isnotnull(median_bytes_per_event) AND mad_bytes_per_event>0 | eval bpe_deviation=round(abs(bytes_per_event-median_bytes_per_event)/mad_bytes_per_event,1) | eval volume_normal=if(abs(gb_24h-median_gb_day)<(4*mad_gb_day),"yes","no") | where bpe_deviation>6 | lookup dc_datasets_lookup dataset_id OUTPUT declared_tier, ae_name, technical_owner, schema_version | eval finding=if(volume_normal="yes","SILENT FORMAT CHANGE - payload shape moved, volume normal","payload and volume both moved"), direction=if(bytes_per_event<median_bytes_per_event,"events got smaller - truncation or dropped fields","events got larger - added fields or format change") | table dataset_id ae_name declared_tier sourcetype index_family bytes_per_event median_bytes_per_event bpe_deviation direction finding schema_version technical_owner | sort - bpe_deviation
