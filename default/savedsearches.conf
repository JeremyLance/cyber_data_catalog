[DC - 99b - UF count validation against HF-reported connections]
description = Cross-checks the number of UFs dc_uf_nodes says flow through each HF against connected_forwarders that DC-90 wrote from the HF's own tcpin telemetry. A mismatch means either a UF is connecting intermittently (missed by the 1h window) or dc_uf_nodes has gone stale.
search = | inputlookup dc_uf_nodes_lookup where status="active" | stats dc(uf_id) as ufs_tracked by connects_via_hf_id | rename connects_via_hf_id as node_id | lookup dc_infra_observed_lookup node_id OUTPUT connected_forwarders as hf_reported_count | eval delta=hf_reported_count-ufs_tracked | lookup dc_infra_nodes_lookup node_id OUTPUT node_name, uhgid, ae_name | table node_id node_name uhgid ae_name ufs_tracked hf_reported_count delta | sort - delta
cron_schedule = 15 7 * * *
dispatch.earliest_time = -1m@m
dispatch.latest_time = now
enableSched = 1
disabled = 0

[DC - 101 - Build CIM coverage scorecard (8-domain)]
description = Builds the CIM Coverage Command Center dashboard's fast/default view. tstats cannot apply eval inside an aggregation (count(eval(...)) is a stats-only construct - using it in tstats throws "TsidxStats: cannot apply eval function to aggregation function"), so each field's has_X count is its own tstats WHERE-filtered call, merged per domain via append + stats (no joins). Runs every 4h over a non-overlapping -4h@h window (05 past the hour, every 4th hour) instead of one daily 24h scan, trading full-day coverage for a much smaller per-run dataset and a fresher (max 4h stale) scorecard.
search = | tstats summariesonly=true count as total from datamodel=Authentication where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
| append [ | tstats summariesonly=true count as has_user from datamodel=Authentication where `dc_scope_indexes` earliest=-4h@h latest=@h Authentication.user!="unknown" by index sourcetype ] \
| append [ | tstats summariesonly=true count as has_action from datamodel=Authentication where `dc_scope_indexes` earliest=-4h@h latest=@h Authentication.action!="unknown" by index sourcetype ] \
| append [ | tstats summariesonly=true count as has_src from datamodel=Authentication where `dc_scope_indexes` earliest=-4h@h latest=@h Authentication.src!="unknown" by index sourcetype ] \
| append [ | tstats summariesonly=true count as has_dest from datamodel=Authentication where `dc_scope_indexes` earliest=-4h@h latest=@h Authentication.dest!="unknown" by index sourcetype ] \
| append [ | tstats summariesonly=true count as has_app from datamodel=Authentication where `dc_scope_indexes` earliest=-4h@h latest=@h Authentication.app!="unknown" by index sourcetype ] \
| stats sum(total) as total, sum(has_user) as has_user, sum(has_action) as has_action, sum(has_src) as has_src, sum(has_dest) as has_dest, sum(has_app) as has_app by index sourcetype \
| eval domain="Authentication", coverage_score=round((round(100*has_user/total,2)*0.30)+(round(100*has_action/total,2)*0.25)+(round(100*has_src/total,2)*0.20)+(round(100*has_dest/total,2)*0.15)+(round(100*has_app/total,2)*0.10),2) \
| table domain index sourcetype total coverage_score \
| append [ \
    | tstats summariesonly=true count as total from datamodel=Alerts where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
    | append [ | tstats summariesonly=true count as has_signature from datamodel=Alerts where `dc_scope_indexes` earliest=-4h@h latest=@h Alerts.signature!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_severity from datamodel=Alerts where `dc_scope_indexes` earliest=-4h@h latest=@h Alerts.severity!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_outcome from datamodel=Alerts where `dc_scope_indexes` earliest=-4h@h latest=@h Alerts.outcome!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_user from datamodel=Alerts where `dc_scope_indexes` earliest=-4h@h latest=@h Alerts.user!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_dest from datamodel=Alerts where `dc_scope_indexes` earliest=-4h@h latest=@h Alerts.dest!="unknown" by index sourcetype ] \
    | stats sum(total) as total, sum(has_signature) as has_signature, sum(has_severity) as has_severity, sum(has_outcome) as has_outcome, sum(has_user) as has_user, sum(has_dest) as has_dest by index sourcetype \
    | eval domain="Alerts", coverage_score=round((round(100*has_signature/total,2)*0.25)+(round(100*has_severity/total,2)*0.25)+(round(100*has_outcome/total,2)*0.25)+(round(100*has_user/total,2)*0.15)+(round(100*has_dest/total,2)*0.10),2) \
    | table domain index sourcetype total coverage_score \
] \
| append [ \
    | tstats summariesonly=true count as total from datamodel=Network_Traffic.All_Traffic where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
    | append [ | tstats summariesonly=true count as has_src from datamodel=Network_Traffic.All_Traffic where `dc_scope_indexes` earliest=-4h@h latest=@h All_Traffic.src!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_dest from datamodel=Network_Traffic.All_Traffic where `dc_scope_indexes` earliest=-4h@h latest=@h All_Traffic.dest!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_action from datamodel=Network_Traffic.All_Traffic where `dc_scope_indexes` earliest=-4h@h latest=@h All_Traffic.action!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_app from datamodel=Network_Traffic.All_Traffic where `dc_scope_indexes` earliest=-4h@h latest=@h All_Traffic.app!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_bytes from datamodel=Network_Traffic.All_Traffic where `dc_scope_indexes` earliest=-4h@h latest=@h All_Traffic.bytes>0 by index sourcetype ] \
    | stats sum(total) as total, sum(has_src) as has_src, sum(has_dest) as has_dest, sum(has_action) as has_action, sum(has_app) as has_app, sum(has_bytes) as has_bytes by index sourcetype \
    | eval domain="Network_Traffic", coverage_score=round((round(100*has_src/total,2)*0.25)+(round(100*has_dest/total,2)*0.25)+(round(100*has_action/total,2)*0.25)+(round(100*has_app/total,2)*0.15)+(round(100*has_bytes/total,2)*0.10),2) \
    | table domain index sourcetype total coverage_score \
] \
| append [ \
    | tstats summariesonly=true count as total from datamodel=Network_Sessions where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
    | append [ | tstats summariesonly=true count as has_src from datamodel=Network_Sessions where `dc_scope_indexes` earliest=-4h@h latest=@h All_Sessions.src!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_dest from datamodel=Network_Sessions where `dc_scope_indexes` earliest=-4h@h latest=@h All_Sessions.dest!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_action from datamodel=Network_Sessions where `dc_scope_indexes` earliest=-4h@h latest=@h All_Sessions.action!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_app from datamodel=Network_Sessions where `dc_scope_indexes` earliest=-4h@h latest=@h All_Sessions.app!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_bytes from datamodel=Network_Sessions where `dc_scope_indexes` earliest=-4h@h latest=@h All_Sessions.bytes>0 by index sourcetype ] \
    | stats sum(total) as total, sum(has_src) as has_src, sum(has_dest) as has_dest, sum(has_action) as has_action, sum(has_app) as has_app, sum(has_bytes) as has_bytes by index sourcetype \
    | eval domain="Network_Sessions", coverage_score=round((round(100*has_src/total,2)*0.25)+(round(100*has_dest/total,2)*0.25)+(round(100*has_action/total,2)*0.25)+(round(100*has_app/total,2)*0.15)+(round(100*has_bytes/total,2)*0.10),2) \
    | table domain index sourcetype total coverage_score \
] \
| append [ \
    | tstats summariesonly=true count as total from datamodel=Intrusion_Detection where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
    | append [ | tstats summariesonly=true count as has_signature from datamodel=Intrusion_Detection where `dc_scope_indexes` earliest=-4h@h latest=@h IDS_Attacks.signature!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_severity from datamodel=Intrusion_Detection where `dc_scope_indexes` earliest=-4h@h latest=@h IDS_Attacks.severity!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_src from datamodel=Intrusion_Detection where `dc_scope_indexes` earliest=-4h@h latest=@h IDS_Attacks.src!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_dest from datamodel=Intrusion_Detection where `dc_scope_indexes` earliest=-4h@h latest=@h IDS_Attacks.dest!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_action from datamodel=Intrusion_Detection where `dc_scope_indexes` earliest=-4h@h latest=@h IDS_Attacks.action!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_app from datamodel=Intrusion_Detection where `dc_scope_indexes` earliest=-4h@h latest=@h IDS_Attacks.app!="unknown" by index sourcetype ] \
    | stats sum(total) as total, sum(has_signature) as has_signature, sum(has_severity) as has_severity, sum(has_src) as has_src, sum(has_dest) as has_dest, sum(has_action) as has_action, sum(has_app) as has_app by index sourcetype \
    | eval domain="Intrusion_Detection", coverage_score=round((round(100*has_signature/total,2)*0.25)+(round(100*has_severity/total,2)*0.25)+(round(100*has_src/total,2)*0.20)+(round(100*has_dest/total,2)*0.20)+(round(100*has_action/total,2)*0.05)+(round(100*has_app/total,2)*0.05),2) \
    | table domain index sourcetype total coverage_score \
] \
| append [ \
    | tstats summariesonly=true count as total from datamodel=Malware where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
    | append [ | tstats summariesonly=true count as has_signature from datamodel=Malware where `dc_scope_indexes` earliest=-4h@h latest=@h Malware_Attacks.signature!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_severity from datamodel=Malware where `dc_scope_indexes` earliest=-4h@h latest=@h Malware_Attacks.severity!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_dest from datamodel=Malware where `dc_scope_indexes` earliest=-4h@h latest=@h Malware_Attacks.dest!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_file_name from datamodel=Malware where `dc_scope_indexes` earliest=-4h@h latest=@h Malware_Attacks.file_name!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_file_hash from datamodel=Malware where `dc_scope_indexes` earliest=-4h@h latest=@h Malware_Attacks.file_hash!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_user from datamodel=Malware where `dc_scope_indexes` earliest=-4h@h latest=@h Malware_Attacks.user!="unknown" by index sourcetype ] \
    | stats sum(total) as total, sum(has_signature) as has_signature, sum(has_severity) as has_severity, sum(has_dest) as has_dest, sum(has_file_name) as has_file_name, sum(has_file_hash) as has_file_hash, sum(has_user) as has_user by index sourcetype \
    | eval domain="Malware", coverage_score=round((round(100*has_signature/total,2)*0.25)+(round(100*has_severity/total,2)*0.25)+(round(100*has_dest/total,2)*0.20)+(round(100*has_file_name/total,2)*0.15)+(round(100*has_file_hash/total,2)*0.10)+(round(100*has_user/total,2)*0.05),2) \
    | table domain index sourcetype total coverage_score \
] \
| append [ \
    | tstats summariesonly=true count as total from datamodel=Endpoint.Processes where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
    | append [ | tstats summariesonly=true count as has_process from datamodel=Endpoint.Processes where `dc_scope_indexes` earliest=-4h@h latest=@h Processes.process_name!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_dest from datamodel=Endpoint.Processes where `dc_scope_indexes` earliest=-4h@h latest=@h Processes.dest!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_user from datamodel=Endpoint.Processes where `dc_scope_indexes` earliest=-4h@h latest=@h Processes.user!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_parent from datamodel=Endpoint.Processes where `dc_scope_indexes` earliest=-4h@h latest=@h Processes.parent_process_name!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_pid from datamodel=Endpoint.Processes where `dc_scope_indexes` earliest=-4h@h latest=@h Processes.process_id!="unknown" by index sourcetype ] \
    | stats sum(total) as total, sum(has_process) as has_process, sum(has_dest) as has_dest, sum(has_user) as has_user, sum(has_parent) as has_parent, sum(has_pid) as has_pid by index sourcetype \
    | eval domain="Endpoint", coverage_score=round((round(100*has_process/total,2)*0.25)+(round(100*has_dest/total,2)*0.25)+(round(100*has_user/total,2)*0.20)+(round(100*has_parent/total,2)*0.20)+(round(100*has_pid/total,2)*0.10),2) \
    | table domain index sourcetype total coverage_score \
] \
| append [ \
    | tstats summariesonly=true count as total from datamodel=Web where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
    | append [ | tstats summariesonly=true count as has_url from datamodel=Web where `dc_scope_indexes` earliest=-4h@h latest=@h Web.url!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_dest from datamodel=Web where `dc_scope_indexes` earliest=-4h@h latest=@h Web.dest!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_user from datamodel=Web where `dc_scope_indexes` earliest=-4h@h latest=@h Web.user!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_method from datamodel=Web where `dc_scope_indexes` earliest=-4h@h latest=@h Web.http_method!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_status from datamodel=Web where `dc_scope_indexes` earliest=-4h@h latest=@h Web.status!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_src from datamodel=Web where `dc_scope_indexes` earliest=-4h@h latest=@h Web.src!="unknown" by index sourcetype ] \
    | stats sum(total) as total, sum(has_url) as has_url, sum(has_dest) as has_dest, sum(has_user) as has_user, sum(has_method) as has_method, sum(has_status) as has_status, sum(has_src) as has_src by index sourcetype \
    | eval domain="Web", coverage_score=round((round(100*has_url/total,2)*0.25)+(round(100*has_dest/total,2)*0.20)+(round(100*has_user/total,2)*0.15)+(round(100*has_method/total,2)*0.15)+(round(100*has_status/total,2)*0.15)+(round(100*has_src/total,2)*0.10),2) \
    | table domain index sourcetype total coverage_score \
] \
| append [ \
    | tstats summariesonly=true count as total from datamodel=Change where `dc_scope_indexes` earliest=-4h@h latest=@h by index sourcetype \
    | append [ | tstats summariesonly=true count as has_object from datamodel=Change where `dc_scope_indexes` earliest=-4h@h latest=@h All_Changes.object!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_action from datamodel=Change where `dc_scope_indexes` earliest=-4h@h latest=@h All_Changes.action!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_result from datamodel=Change where `dc_scope_indexes` earliest=-4h@h latest=@h All_Changes.result!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_user from datamodel=Change where `dc_scope_indexes` earliest=-4h@h latest=@h All_Changes.user!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_dest from datamodel=Change where `dc_scope_indexes` earliest=-4h@h latest=@h All_Changes.dest!="unknown" by index sourcetype ] \
    | append [ | tstats summariesonly=true count as has_src from datamodel=Change where `dc_scope_indexes` earliest=-4h@h latest=@h All_Changes.src!="unknown" by index sourcetype ] \
    | stats sum(total) as total, sum(has_object) as has_object, sum(has_action) as has_action, sum(has_result) as has_result, sum(has_user) as has_user, sum(has_dest) as has_dest, sum(has_src) as has_src by index sourcetype \
    | eval domain="Change", coverage_score=round((round(100*has_object/total,2)*0.25)+(round(100*has_action/total,2)*0.20)+(round(100*has_result/total,2)*0.20)+(round(100*has_user/total,2)*0.15)+(round(100*has_dest/total,2)*0.10)+(round(100*has_src/total,2)*0.10),2) \
    | table domain index sourcetype total coverage_score \
