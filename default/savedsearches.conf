| eval has_any_coverage=if(coverage_score>0,1,0) | eval _key=domain."|".index."|".sourcetype, checked=now() | table _key domain index sourcetype total coverage_score has_any_coverage checked | outputlookup dc_cim_coverage_scorecard_lookup
