[DC - 97 - Infra dependency check - datasets behind each node]
description = description = Answers 'what data goes dark if this node dies' - the infra equivalent of the KO dependency graph. Maps each node to the datasets whose events actually carry its hostname, so blast radius is measured rather than assumed from tenant assignment alone. Rewritten in v0.4.3 to remove map-with-string-substitution entirely, after a duplicate host in dc_infra_nodes produced a malformed subsearch and crashed the prior version. This version joins host activity to the node registry as data (not as text substituted into SPL), which cannot break the same way even if a future data-quality issue reintroduces a duplicate - it will show up as an extra row to investigate, not a crashed search. Also now dedupes on host explicitly before use, as defense in depth against the source inventory file having duplicate rows (confirmed present in your upload - 3 dropped when the seed was rebuilt).
search = | inputlookup dc_infra_nodes_lookup where status="active" | dedup host | fields node_id, host | join type=left host   [ | tstats count as events, values(index) as indexes, values(sourcetype) as sourcetypes     where `dc_scope_indexes` earliest=-24h by host ] | where isnotnull(events) | eval index_list=split(mvjoin(indexes,","),","), st_list=split(mvjoin(sourcetypes,","),",") | eval pair=mvzip(index_list,st_list,"||") | mvexpand pair | eval index=mvindex(split(pair,"||"),0), sourcetype=mvindex(split(pair,"||"),1) | `dc_key` | stats values(dataset_id) as datasets_behind_node, dc(dataset_id) as dataset_count by node_id | eval dataset_id_mv=split(mvjoin(datasets_behind_node,","),",") | mvexpand dataset_id_mv | rename dataset_id_mv as dataset_id | lookup dc_datasets_lookup dataset_id OUTPUT declared_tier | stats values(datasets_behind_node) as datasets_behind_node, values(dataset_count) as dataset_count, dc(eval(if(declared_tier="Tier 0",dataset_id,null()))) as tier0_datasets_behind_node by node_id | eval dataset_count=mvindex(dataset_count,0) | eval _key=node_id | lookup dc_infra_nodes_lookup node_id OUTPUT node_name, node_type, uhgid, ae_name, environment, role, host, ip_address, version, os, deployment_method, upstream_targets, downstream_indexes, declared_tier, technical_owner, backup_owner, datacenter_site, ha_pair_id, status, lifecycle_state, onboard_date, last_reviewed, notes | table _key node_id node_name node_type uhgid ae_name environment role host ip_address version os deployment_method upstream_targets downstream_indexes declared_tier technical_owner backup_owner datacenter_site ha_pair_id status lifecycle_state onboard_date last_reviewed notes datasets_behind_node dataset_count tier0_datasets_behind_node | outputlookup append=t dc_infra_nodes_lookup
