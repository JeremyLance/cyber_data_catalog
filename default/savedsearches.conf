[DC - 63 - ATT&CK detection mapping (detail)]
description = Per-technique, per-detection mapping - one row per (technique x knowledge object). This is the drill-down table behind DC-62/DC-attack_coverage: it names which specific detections cover a technique, whether each is currently healthy, and which datasets it depends on. Derived entirely from correlation search annotations for now (source=annotations). If a live MITRE ATT&CK feed becomes available later, add it as a second collector into the same collection with source=mitre_api and a technique_name/tactic/sub_technique join - no redesign needed, this table already carries those fields.
search = | inputlookup dc_ko_lookup where enabled="yes" AND ko_type="correlation_search" | where isnotnull(mitre_technique) AND mitre_technique!="" | spath input=mitre_technique output=techniques path=mitre_attack{} | eval techniques=coalesce(techniques, mitre_technique) | makemv delim="," techniques | mvexpand techniques | rex field=techniques "(?<technique>T\d{4})(?:\.(?<sub_technique>\d{3}))?" | where isnotnull(technique) | eval sub_technique=if(isnotnull(sub_technique),technique."\.".sub_technique,"") | lookup dc_detection_health_lookup ko_id OUTPUT health_state | join type=left ko_id   [ | inputlookup dc_dependencies_lookup where dep_type="dataset"     | rename dep_value as dataset_id     | lookup dc_observed_lookup dataset_id OUTPUT last_seen     | lookup dc_cim_compliance_lookup dataset_id OUTPUT capture_rate_pct     | eval at_risk=if(isnull(last_seen) OR (now()-last_seen)>86400 OR capture_rate_pct<95,1,0)     | stats max(at_risk) as data_at_risk, values(dataset_id) as datasets_supporting by ko_id ] | fillnull value=0 data_at_risk | eval data_at_risk=if(data_at_risk=1,"yes","no") | eval datasets_supporting=mvjoin(datasets_supporting,", ") | eval tactic="", technique_name="" | lookup dc_attack_reference_seed technique OUTPUT tactic as ref_tactic, technique_name as ref_name | eval tactic=coalesce(ref_tactic,tactic), technique_name=coalesce(ref_name,technique_name) | eval mapping_id=technique."|".ko_id, _key=mapping_id, source="annotations", discovered=now() | table _key mapping_id technique sub_technique tactic technique_name ko_id ko_name ko_type ko_tier app owner enabled health_state data_at_risk datasets_supporting source discovered | outputlookup append=t dc_attack_mapping_lookup
