[DC - 38 - Shadow dataset classification]
description = Buckets every observed-but-uncataloged (index, sourcetype) pair into MALFORMED_SOURCETYPE (fails dc_valid_sourcetype - a source-side parsing bug, route to Splunk admin/tenant eng), CONTRACT_MATCHED_EXACT (sourcetype+index already has a contract record for this tenant - fast-track into the catalog), CONTRACT_MATCHED_OTHER_TENANT (sourcetype contracted elsewhere, not yet for this tenant - extend the existing contract rather than starting a new CDE review), or UNMATCHED_NOVEL (no contract record anywhere - needs a new vendor/product contract before it can be cataloged). cde_approval is carried through as-is so the panel can tell "matched" apart from "matched AND CDE-approved" the moment CDE starts populating it - no search logic needs to change when that happens.
search = | tstats count as events_24h where `dc_scope_indexes` earliest=-24h by index sourcetype | `dc_key` | lookup dc_datasets_lookup dataset_id OUTPUT status | where isnull(status) | `dc_valid_sourcetype(sourcetype)` | lookup dc_contract_master sourcetype index OUTPUT contract_issue as exact_ticket, cde_approval as exact_cde_approval, ae_name as exact_ae_name | lookup dc_contract_master sourcetype OUTPUT contract_issue as any_ticket, cde_approval as any_cde_approval, index as contracted_index | lookup dc_sourcetype_rejections_lookup sourcetype OUTPUT status as reject_status, reason as reject_reason, ticket as reject_ticket | eval classification=case(sourcetype_valid="no","MALFORMED_SOURCETYPE", reject_status="rejected","REJECTED", isnotnull(exact_ticket),"CONTRACT_MATCHED_EXACT", isnotnull(any_ticket),"CONTRACT_MATCHED_OTHER_TENANT", 1=1,"UNMATCHED_NOVEL") | eval cde_approved=case(classification="CONTRACT_MATCHED_EXACT",coalesce(exact_cde_approval,"false"), classification="CONTRACT_MATCHED_OTHER_TENANT",coalesce(any_cde_approval,"false"), 1=1,"") | eval _key=dataset_id, checked=now() | table _key dataset_id uhgid sourcetype index events_24h classification cde_approved exact_ticket any_ticket contracted_index reject_reason reject_ticket checked | outputlookup dc_shadow_classification_lookup
