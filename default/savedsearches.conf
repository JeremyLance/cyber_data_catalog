[DC - 42 - Silent detection review]
description = The gap that matters: enabled Tier 0/1 detections that have run successfully for 90 days, never fired, AND whose underlying data IS flowing normally. Either the logic is broken or the normalization is - it is not 'nothing bad happened'.
