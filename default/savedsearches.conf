description = Terminates the blast radius in security outcomes rather than object counts. Losing a feed stops being 'a data issue' and becomes 'we lost detection of these techniques'. Reads from DC-63's detail table rather than re-deriving the technique mapping, so the rollup and the drill-down table can never disagree with each other.
