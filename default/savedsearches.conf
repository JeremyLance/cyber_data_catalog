| `dc_key` \
| `dc_valid_sourcetype(sourcetype)` \
| where sourcetype_valid="yes" \
| eval _key=dataset_id, first_observed=first_observed, last_seen=last_seen \
| table _key dataset_id index sourcetype events_24h hosts_24h first_observed last_seen \
| outputlookup append=t dc_observed_lookup
