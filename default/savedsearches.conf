[DC - 60 - Federated requirement gap register]
description = description = Inverts the catalog. Instead of 'what do we have', answers 'what did the six-domain model say every tenant MUST have, and who is missing it'. Rewritten in v0.3.5 to join on index_family (exact match via dc_index_family) instead of regex substring matching against a hand-built prefix string - the prior version's index_prefix patterns didn't correspond to your actual ratified index registry (sec_identity/sec_pam/sec_cloud never existed; the real families are sec_auth and sec_aws/azure/gcp) and a stray header row had leaked into the data.
search = | inputlookup dc_datasets_lookup | stats first(ae_name) as ae_name by uhgid | eval join_key=1 | join type=inner max=0 join_key [ | inputlookup dc_requirement_map | eval join_key=1 | fields join_key req_id domain required index_family ] | makemv delim="|" index_family | mvexpand index_family | eval pair=uhgid."#".index_family | join type=left pair [ | tstats count where `dc_scope_indexes` earliest=-24h by index | `dc_key` | `dc_index_family` | where isnotnull(index_family) | eval pair=uhgid."#".index_family, flowing=1 | stats max(flowing) as flowing by pair ] | join type=left pair [ | inputlookup dc_datasets_lookup where status="active" | `dc_index_family` | where isnotnull(index_family) | eval pair=uhgid."#".index_family, cataloged=1 | stats max(cataloged) as cataloged by pair ] | stats max(flowing) as has_flowing, max(cataloged) as has_cataloged, values(index_family) as index_family, values(eval(if(flowing=1,index_family,null()))) as matched_families by uhgid ae_name req_id domain required | fillnull value=0 has_flowing has_cataloged | eval status=case(has_flowing=1,"COVERED", has_cataloged=1,"CATALOGED_NOT_FLOWING", required="Yes","GAP - REQUIRED", 1=1,"not applicable") | eval gap_reason=case(status="GAP - REQUIRED","No telemetry in index family ".mvjoin(index_family," or ")." for this tenant", status="CATALOGED_NOT_FLOWING","Registered but no events in 24h", 1=1,"") | eval index_family=mvjoin(index_family,"|"), matched_datasets=mvjoin(matched_families,", ") | eval coverage_id=uhgid."|".req_id, _key=coverage_id, checked=now() | table _key coverage_id uhgid ae_name req_id domain index_family required status matched_datasets gap_reason checked | outputlookup append=t dc_requirement_coverage_lookup
