[DC - 33 - CIM required field coverage]
description = description = Field-level CIM compliance for Tier 0/1: are the fields the data model REQUIRES actually populated? A field that exists but is empty 60% of the time breaks detections without breaking the model. TUNE BEFORE ENABLING: this uses map+fieldsummary, which is genuinely expensive because field population is sourcetype-specific and cannot be computed in one bulk pass the way DC-32 was. v0.3.3 shrinks it three ways: (1) dedup to one search per distinct sourcetype+schema_version instead of per dataset, so ten tenants sharing one sourcetype cost one subsearch, not ten; (2) hard sample cap via head so fieldsummary scans at most 2000 events; (3) narrower time window. If it still times out on your instance, lower maxsearches further and/or split Tier 0 and Tier 1 into two separate scheduled searches so each has a smaller candidate set.
search = | inputlookup dc_datasets_lookup where (declared_tier="Tier 0" OR declared_tier="Tier 1") AND status="active" | fields index, sourcetype, dataset_id, schema_version, cim_datamodel | dedup sourcetype, schema_version | map maxsearches=40 search="search index=$index$ sourcetype=$sourcetype$ earliest=-70m@m latest=-10m@m | head 2000 | fields - _raw | fieldsummary maxvals=0 | eval dataset_id=\"$dataset_id$\", sourcetype=\"$sourcetype$\", schema_version=\"$schema_version$\", cim_datamodel=\"$cim_datamodel$\"" | rename field as field_name | eventstats max(count) as total_events by sourcetype, schema_version | eval coverage_pct=round(count/total_events*100,1) | lookup dc_schema_fields_lookup sourcetype schema_version field_name OUTPUT cim_field, required, min_coverage_pct, sensitivity | where required="true" AND cim_field!="" | stats count as required_fields_total, sum(eval(if(coverage_pct>=coalesce(min_coverage_pct,95),1,0))) as required_fields_present, values(eval(if(coverage_pct<coalesce(min_coverage_pct,95),cim_field,null()))) as failing_fields by sourcetype, schema_version, cim_datamodel | eval field_coverage_pct=round(required_fields_present/required_fields_total*100,1) | join type=inner sourcetype, schema_version   [ | inputlookup dc_datasets_lookup where (declared_tier="Tier 0" OR declared_tier="Tier 1") AND status="active"     | fields dataset_id, sourcetype, schema_version ] | eval _key=dataset_id."|".cim_datamodel, checked=now() | lookup dc_cim_compliance_lookup _key OUTPUT feed_id, raw_events, dm_events, capture_rate_pct, tag_coverage_pct, cim_state | table _key dataset_id feed_id cim_datamodel raw_events dm_events capture_rate_pct required_fields_total required_fields_present field_coverage_pct tag_coverage_pct cim_state checked | outputlookup append=t dc_cim_compliance_lookup
