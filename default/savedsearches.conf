[DC - 93 - Infra node outage (Tier 0 - immediate)]
description = description = Drives the tightened Tier 0 SLA for infra: 10-minute silence budget, not 30. A dead Tier 0 HF/EP takes every downstream dataset dark simultaneously - this is meant to fire and route to the war room BEFORE the per-dataset Tier 0 alerts (DC-05) start cascading in from everything behind it, so the on-call engineer sees 'the HF at WellMed is down' instead of fifteen simultaneous 'data stopped' tickets with no obvious common cause. v0.4.3: now also fires on connected_to_cloud=no even when the node is heartbeating locally - DC-90's tcpout_connections check catches an HF that is alive and processing but has lost its path TO Splunk Cloud specifically, which silence-based detection alone would miss for up to the full 10-minute window (or longer, since local queue metrics can look briefly normal while cloud connectivity is actually down).
search = | inputlookup dc_infra_nodes_lookup where status="active" | `dc_infra_default_silence` | lookup dc_infra_observed_lookup node_id OUTPUT last_heartbeat, queue_status, max_queue_pct, events_processed_1h, connected_forwarders, health_score, connected_to_cloud | eval silence_minutes=if(isnull(last_heartbeat),99999,round((now()-last_heartbeat)/60,1)) | eval state=case(silence_minutes>max_silence_minutes,"NODE_DOWN", connected_to_cloud="no","DISCONNECTED_FROM_CLOUD", queue_status="blocked","QUEUE_BLOCKED", queue_status="backing_up" AND max_queue_pct>90,"QUEUE_CRITICAL", queue_status="backing_up","QUEUE_BACKING_UP", isnotnull(health_score) AND health_score<50,"HEALTH_DEGRADED", 1=1,"OK") | where state!="OK" AND declared_tier="Tier 0" | eval blast_radius_hint="Check every dataset where technical_owner=".technical_owner." or environment=".environment." for a simultaneous outage - it is this node, not the data." | table node_id node_name node_type uhgid ae_name environment role state silence_minutes health_score connected_to_cloud max_queue_pct connected_forwarders technical_owner backup_owner blast_radius_hint | sort - silence_minutes
