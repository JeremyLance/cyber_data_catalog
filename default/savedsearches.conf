[DC - 92 - Edge Processor heartbeat (OTel self-metrics)]
description = Replaces traffic-proxy EP liveness (DC-90's ep_fwdtype branch) with the EP's own self-reported up/process_uptime metrics - confirmed faster and independent of 9997 (see KSC_edge firewall case, 2026-10-21). Merge-safe: only touches rows for node_id values that are Edge Processors; HF rows written by DC-90 are preserved via the inputlookup/stats latest(*) pattern. A host that stops reporting simply stops getting a fresh row here, so its last_heartbeat freezes and DC-93/DC-94's existing silence_minutes math ages it out naturally - no separate "down" branch needed.
search = | mstats avg(up) as up_avg WHERE index=_metrics earliest=-15m latest=now by host.name span=1m | stats max(_time) as last_heartbeat, latest(up_avg) as up_avg by host.name | rename host.name as host | eval host_short=lower(mvindex(split(host,"."),0)) | join type=inner host_short [ | inputlookup dc_infra_nodes_lookup where status="active" AND node_type="Edge Processor" | eval host_short=lower(mvindex(split(host,"."),0)) | dedup host_short | fields node_id, host_short ] | eval connected_to_cloud=if(up_avg>=0.5,"yes","no"), health_score=if(connected_to_cloud="yes",100,0), uptime_status="reporting", heartbeat_source="otel metrics (_metrics up)", _key=node_id, checked=now() | table _key node_id last_heartbeat uptime_status heartbeat_source connected_to_cloud health_score checked | append [| inputlookup dc_infra_observed_lookup ] | eval merge_key=_key | dedup merge_key | fields - merge_key | outputlookup dc_infra_observed_lookup
