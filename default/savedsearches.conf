[DC - 91 - Auto-populate Edge Processor nodes (OTel metrics, control-plane-free)]
description = Registers every EP host seen reporting self-telemetry to _metrics (confirmed 2026-10-21 as the fastest, most reliable EP liveness signal - independent of 9997/customer-data flow). Resolves AE via slug-match against dc_datasets_lookup ae_name; unmatched groups get uhgid=UNRESOLVED:<ep_group_name> for manual ratification, same pattern as DC-00d's AE-variant handling. Preserves any owner/tier/status a human has already set. Validated against the control plane's own processors API export (126 instances/32 groups, 2026-10-21) before being enabled. Safe to re-run.
search = | mstats avg(up) as up_avg, latest(process_uptime) as uptime_sec WHERE index=_metrics by host.name, processor.id, service.instance.id span=1h | stats max(_time) as last_seen, latest(up_avg) as up_avg by host.name, processor.id | rename host.name as host, processor.id as processor_id | lookup dc_ep_group_lookup processor_id OUTPUT ep_group_name | eval ae_guess=lower(replace(replace(ep_group_name,"_edge$|_splunk_edge$|_mg_edge$|_ep$",""),"_"," ")) | join type=left ae_guess [ | inputlookup dc_datasets_lookup | eval ae_guess=lower(ae_name) | dedup ae_guess | fields ae_guess, uhgid, ae_name ] | eval uhgid=coalesce(uhgid,"UNRESOLVED:".ep_group_name), ae_name=coalesce(ae_name,ep_group_name) | eval node_id="edge_processor|".uhgid."|".host, node_name=host, node_type="Edge Processor", role="Edge Processor", environment="saas2", deployment_method="unknown" | lookup dc_infra_nodes_lookup node_id OUTPUT technical_owner as kv_owner, backup_owner as kv_backup, declared_tier as kv_tier, status as kv_status, lifecycle_state as kv_lifecycle, datacenter_site as kv_site, ha_pair_id as kv_ha, notes as kv_notes, onboard_date as kv_onboard, last_reviewed as kv_reviewed | eval technical_owner=coalesce(kv_owner,""), backup_owner=coalesce(kv_backup,""), declared_tier=coalesce(kv_tier,"Unassigned - review"), status=coalesce(kv_status,"active"), lifecycle_state=coalesce(kv_lifecycle,"discovered via otel metrics"), datacenter_site=coalesce(kv_site,""), ha_pair_id=coalesce(kv_ha,""), notes=coalesce(kv_notes,"ep_group=".ep_group_name), onboard_date=coalesce(kv_onboard,now()), last_reviewed=coalesce(kv_reviewed,now()) | fields - kv_* ae_guess up_avg last_seen | table _key node_id node_name node_type uhgid ae_name environment role host ip_address version os deployment_method upstream_targets downstream_indexes declared_tier technical_owner backup_owner datacenter_site ha_pair_id status lifecycle_state onboard_date last_reviewed notes | eval _key=node_id | outputlookup append=t dc_infra_nodes_lookup
