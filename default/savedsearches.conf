[DC - 32 - CIM data model capture rate]
description = THE normalization metric. Compares raw event count to what the CIM data model can actually see. Data sitting in an index that the data model cannot pick up is invisible to every ES detection built on that model. v0.3.4: fixed raw_events join - it was being appended as its own row with no cim_datamodel value, so it never merged with the dm_events rows for the same index/sourcetype and raw_events stayed null for every row, forcing every dataset into NOT_NORMALIZED regardless of actual CIM coverage. Now joined on index/sourcetype directly so it lands on every cim_datamodel row for that dataset. Also switched output from outputlookup append=t to the merge-safe inputlookup/stats latest(*) pattern used elsewhere in this app, so dc_cim_compliance_lookup stops growing unbounded on every run.
search = | inputlookup dc_cim_compliance_lookup | append [ | inputlookup dc_datasets_lookup where status="active" | where cim_datamodel!="" AND cim_datamodel!="—" | `dc_split_cim` | stats count by cim_datamodel | append   [ | tstats summariesonly=false count as dm_events from datamodel=Authentication where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Authentication" ] | append   [ | tstats summariesonly=false count as dm_events from datamodel=Change where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Change" ] | append   [ | tstats summariesonly=false count as dm_events from datamodel=Endpoint where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Endpoint" ] | append   [ | tstats summariesonly=false count as dm_events from datamodel=Network_Traffic where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Network_Traffic" ] | append   [ | tstats summariesonly=false count as dm_events from datamodel=Network_Resolution where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Network_Resolution" ] | append   [ | tstats summariesonly=false count as dm_events from datamodel=Web where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Web" ] | append   [ | tstats summariesonly=false count as dm_events from datamodel=Email where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Email" ] | append   [ | tstats summariesonly=false count as dm_events from datamodel=Intrusion_Detection where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Intrusion_Detection" ] | append   [ | tstats summariesonly=false count as dm_events from datamodel=Malware where `dc_scope_indexes` earliest=-24h by index, sourcetype | eval cim_datamodel="Malware" ] | where isnotnull(dm_events) | join type=left index sourcetype   [ | tstats count as raw_events where `dc_scope_indexes` earliest=-24h by index, sourcetype ] | stats sum(dm_events) as dm_events, max(raw_events) as raw_events by index, sourcetype, cim_datamodel | `dc_key` | eval capture_rate_pct=if(raw_events=0,0,round(dm_events/raw_events*100,1)) | eval cim_state=case(raw_events=0,"no_data", capture_rate_pct>=95,"compliant", capture_rate_pct>=50,"partial", capture_rate_pct>0,"poor", 1=1,"NOT_NORMALIZED") | eval _key=dataset_id."|".cim_datamodel, checked=now() | table _key dataset_id cim_datamodel raw_events dm_events capture_rate_pct cim_state checked ] | stats latest(*) as * by _key | outputlookup dc_cim_compliance_lookup | where cim_state IN ("NOT_NORMALIZED","poor","partial")
