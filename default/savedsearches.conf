[DC - 73 - Byte-level volume baseline and truncation canary]
description = Baselines GB/day AND bytes-per-event per dataset. Event counts alone miss truncation and format changes: the count holds steady while the payload shrinks. A drop in bytes-per-event with stable event count is a parsing or upstream format change, not a volume incident.
