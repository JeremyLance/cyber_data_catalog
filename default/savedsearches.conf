[DC - 00e - Detect and log infrastructure drift (IP, version)]
description = Tracks IP re-assignment and Splunk version upgrades on registered active nodes. Fixed 2026-10-21: the HF-branch join subsearch was dropping ip_address/version/os via `fields` before renaming them to prev_ip/prev_version/prev_os, so those were always null and every active HF with a found_ip/found_version was incorrectly flagged as drifted every night - confirm whether your dc_infra_nodes_lookup history shows nightly discovery_source="drift_detected" entries for most/all HFs, which would confirm the bug was firing. Also added an Edge Processor branch (version drift only - no IP signal available via this source) using the validated service=edge-processor _internal events; the original search only covered HF via tcpin_connections, so EPs had effectively zero drift coverage. Retains the existing sort -_time + first() pattern over latest() to avoid indextime tie-break inconsistency.
search = index=_internal source=*metrics.log group=tcpin_connections host!="idx*" earliest=-4h \
| eval host_short=lower(mvindex(split(host,"."),0)) \
| stats latest(sourceIp) as found_ip, latest(version) as found_version, latest(os) as found_os by host_short \
| join type=inner host_short \
    [ | inputlookup dc_infra_nodes_lookup where status="active" AND node_type!="Edge Processor" \
      | eval host_short=lower(mvindex(split(host,"."),0)) \
      | fields node_id, host, host_short, ip_address, version, os \
      | rename ip_address as prev_ip, version as prev_version, os as prev_os ] \
| eval ip_changed=if(isnotnull(found_ip) AND found_ip!=prev_ip,1,0), version_changed=if(isnotnull(found_version) AND found_version!=prev_version,1,0) \
| where ip_changed=1 OR version_changed=1 \
| eval ip_address=coalesce(found_ip,prev_ip), version=coalesce(found_version,prev_version), os=coalesce(found_os,prev_os) \
| append \
    [ search (index=_internal source=*edge.log* OR source=*supervisor.log*) service=edge-processor earliest=-24h \
      | stats latest(version) as found_version by host \
      | rename host as found_host \
      | eval host_short=lower(mvindex(split(found_host,"."),0)) \
      | join type=inner host_short \
          [ | inputlookup dc_infra_nodes_lookup where status="active" AND node_type="Edge Processor" \
            | eval host_short=lower(mvindex(split(host,"."),0)) \
            | fields node_id, host, host_short, ip_address, version, os \
            | rename ip_address as prev_ip, version as prev_version, os as prev_os ] \
      | eval version_changed=if(isnotnull(found_version) AND found_version!=prev_version,1,0) \
      | where version_changed=1 \
      | eval version=found_version, ip_address=prev_ip, os=prev_os ] \
| eval discovery_source="drift_detected", discovered_date=now(), last_reviewed=now() \
| eval _key=node_id \
| lookup dc_infra_nodes_lookup node_id OUTPUT node_name, node_type, uhgid, ae_name, environment, role, deployment_method, upstream_targets, downstream_indexes, declared_tier, technical_owner, backup_owner, datacenter_site, ha_pair_id, status, lifecycle_state, onboard_date, notes, datasets_behind_node, dataset_count, tier0_datasets_behind_node \
| table _key node_id node_name node_type uhgid ae_name environment role host ip_address version os deployment_method upstream_targets downstream_indexes declared_tier technical_owner backup_owner datacenter_site ha_pair_id status lifecycle_state onboard_date last_reviewed notes discovery_source discovered_date datasets_behind_node dataset_count tier0_datasets_behind_node \
| outputlookup append=t dc_infra_nodes_lookup
cron_schedule = 0 4 * * *
dispatch.earliest_time = -4h@h
dispatch.latest_time = now
enableSched = 1
disabled = 0

