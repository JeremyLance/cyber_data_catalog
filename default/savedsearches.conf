[DC - 12 - Build dependency edges from SPL]
description = THE GRAPH BUILDER. Parses index=, sourcetype=, datamodel=, lookup, and macro references out of every saved search and dashboard, and writes one edge per dependency. See guide section 5.3 for the macro-expansion caveat.
search = | rest /servicesNS/-/-/saved/searches count=0 splunk_server=local | rename eai:acl.app as app, title as ko_name, search as spl | eval ko_type=case('action.correlationsearch.enabled'=1,"correlation_search", is_scheduled=1,"scheduled_search", 1=1,"saved_search"), ko_id=ko_type.":".app.":".ko_name | append [ | rest /servicesNS/-/-/data/ui/views count=0 splunk_server=local | search isDashboard=1 | rename eai:acl.app as app, title as ko_name, eai:data as spl | eval ko_type="dashboard", ko_id="dashboard:".app.":".label ] | fields ko_id ko_type spl | rex field=spl max_match=100 "index\s*=\s*\"?(?<idx>[\w\*\-]+)" | rex field=spl max_match=100 "sourcetype\s*=\s*\"?(?<st>[\w:\-\*\.]+)" | rex field=spl max_match=50 "datamodel[=:\s\.]+(?<dm>[A-Za-z_][\w_]*)" | rex field=spl max_match=50 "\|\s*(?:input)?lookup\s+(?:local=\S+\s+)?(?<lk>[\w_\-]+)" | rex field=spl max_match=50 "`(?<mc>[a-zA-Z_][\w_]*)" | eval dep=mvappend(mvmap(idx,"index=".idx), mvmap(st,"sourcetype=".st), mvmap(dm,"datamodel=".dm), mvmap(lk,"lookup=".lk), mvmap(mc,"macro=".mc)) | fields ko_id ko_type dep | mvexpand dep | eval dep_type=mvindex(split(dep,"="),0), dep_value=mvindex(split(dep,"="),1) | where isnotnull(dep_value) AND dep_value!="" | dedup ko_id dep_type dep_value | eval _key=ko_id."|".dep_type."|".dep_value, discovery_method="spl_regex", confidence=if(dep_type="macro","low","high"), last_discovered=now() | table _key ko_id ko_type dep_type dep_value discovery_method confidence last_discovered | outputlookup append=t dc_dependencies_lookup
cron_schedule = 45 2 * * *
