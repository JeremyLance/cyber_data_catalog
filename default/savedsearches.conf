[DC - 29 - Generate initial schema from observed data]
description = THE MISSING WRITER for dc_schema_fields - nothing else populates it. Run this ONCE per sourcetype to seed schema_version 1.0 from what is actually flowing, using fieldsummary over a live sample. Review the output before trusting it: mark sensitivity (PHI/PII/none) and cim_field mapping by hand, then treat the schema as frozen and Git-manage it going forward - do not leave this on a recurring schedule, or it will silently redefine your contract every time it runs. Ships disabled and NOT on a cron; run manually via Search, review, then load with dc_key=schema_version fixed at 1.0.
search = | inputlookup dc_datasets_lookup where (declared_tier="Tier 0" OR declared_tier="Tier 1") AND status="active" | fields index, sourcetype, dataset_id, cim_datamodel | dedup sourcetype | map maxsearches=60 search="search index=$index$ sourcetype=$sourcetype$ earliest=-4h | head 5000 | fields - _raw | fieldsummary maxvals=5 | eval sourcetype=\"$sourcetype$\", cim_datamodel=\"$cim_datamodel$\"" | eventstats max(count) as total_events by sourcetype | eval coverage_pct=round(count/total_events*100,1) | eval data_type=if(numeric_count>0 AND numeric_count=count,"number","string") | eval required=if(coverage_pct>=95,"true","false") | eval schema_version="1.0", min_coverage_pct=95, sensitivity="REVIEW", cim_field="", description="auto-generated from observed data - review before use", example=mvindex(values,0) | rename field as field_name | eval _key=sourcetype."|".schema_version."|".field_name | table _key sourcetype schema_version field_name cim_field data_type required min_coverage_pct sensitivity description example | outputlookup append=t dc_schema_fields_lookup
