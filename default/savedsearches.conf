[DC - 80 - Orphan and offboarding gap detection]
description = Catches the four ways offboarding fails: content pointing at retired data, data still ingesting for a decommissioned tenant, retired feeds still costing money, and datasets whose owner left.
search = | inputlookup dc_dependencies_lookup where dep_type="dataset" | rename dep_value as dataset_id | lookup dc_datasets_lookup dataset_id OUTPUT status, lifecycle_state, ae_name, declared_tier, technical_owner | lookup dc_ko_lookup ko_id OUTPUT ko_name, ko_tier, enabled | where enabled="yes" AND (status="retired" OR status="decommissioned" OR lifecycle_state="divested") | eval finding="ORPHAN CONTENT - enabled object queries retired data", remediation="Disable or repoint the knowledge object" | table finding ko_id ko_name ko_tier dataset_id ae_name status remediation | append [ | inputlookup dc_datasets_lookup where status="retired" OR status="decommissioned" OR lifecycle_state="divested" | lookup dc_observed_lookup dataset_id OUTPUT last_seen, events_24h | where isnotnull(last_seen) AND (now()-last_seen)<86400 | eval finding="ZOMBIE INGEST - decommissioned dataset still receiving events", remediation="Stop the forwarder/pipeline; confirm retention and legal hold before deleting" | table finding dataset_id ae_name status events_24h technical_owner remediation ] | append [ | inputlookup dc_feeds_lookup where feed_status="retired" | lookup dc_observed_lookup feed_id OUTPUT events_24h, last_seen | where events_24h>0 | eval finding="RETIRED FEED STILL BILLING - legacy environment not actually cut over", remediation="Complete cutover or correct the feed_status" | table finding feed_id dataset_id environment pipeline events_24h remediation ] | append [ | inputlookup dc_datasets_lookup where status="active" | where isnull(technical_owner) OR technical_owner="" | eval finding="UNOWNED ACTIVE DATASET", remediation="Assign named technical owner and backup" | table finding dataset_id ae_name declared_tier remediation ] | sort finding
