[DC - 00 - Load or refresh catalog seed]
description = THE SEARCH THAT CREATES dc_datasets. Loads the Git-managed seed CSV into the KV Store, preserving every human-entered value already in the collection. Requires the dc_datasets KV Store collection to already be provisioned (it is - via collections.conf/transforms.conf in this app) even though it holds zero rows on first run; the lookup against zero rows is normal and returns no match, not an error. Run it once to populate an empty catalog, and again after every seed-file commit. Safe to re-run: it never overwrites an owner, tier or contract that a person has set.
search = | inputlookup dc_datasets_seed.csv | eval _key=dataset_id, seed_notes=notes | lookup dc_datasets_lookup dataset_id OUTPUT declared_tier as kv_declared_tier, proposed_tier as kv_proposed_tier, business_owner as kv_business_owner, technical_owner as kv_technical_owner, content_owner as kv_content_owner, backup_owner as kv_backup_owner, schema_version as kv_schema_version, contract_status as kv_contract_status, compliance_flags as kv_compliance_flags, status as kv_status, retention_days as kv_retention_days, pipeline as kv_pipeline, environment as kv_environment, lifecycle_state as kv_lifecycle_state, migration_state as kv_migration_state, value_score as kv_value_score, last_reviewed as kv_last_reviewed, notes as kv_notes | eval declared_tier=if(isnotnull(kv_declared_tier) AND kv_declared_tier!="",kv_declared_tier,declared_tier), proposed_tier=coalesce(kv_proposed_tier,proposed_tier), business_owner=if(isnotnull(kv_business_owner) AND kv_business_owner!="",kv_business_owner,business_owner), technical_owner=if(isnotnull(kv_technical_owner) AND kv_technical_owner!="",kv_technical_owner,technical_owner), content_owner=if(isnotnull(kv_content_owner) AND kv_content_owner!="",kv_content_owner,content_owner), backup_owner=if(isnotnull(kv_backup_owner) AND kv_backup_owner!="",kv_backup_owner,backup_owner), schema_version=if(isnotnull(kv_schema_version) AND kv_schema_version!="",kv_schema_version,schema_version), contract_status=if(isnotnull(kv_contract_status) AND kv_contract_status!="",kv_contract_status,contract_status), compliance_flags=coalesce(kv_compliance_flags,compliance_flags), status=if(isnotnull(kv_status) AND kv_status!="",kv_status,coalesce(status,"active")), retention_days=coalesce(kv_retention_days,retention_days), pipeline=if(isnotnull(kv_pipeline) AND kv_pipeline!="",kv_pipeline,pipeline), environment=if(isnotnull(kv_environment) AND kv_environment!="",kv_environment,coalesce(environment,"saas2")), lifecycle_state=coalesce(kv_lifecycle_state,"onboarded"), migration_state=coalesce(kv_migration_state,migration_state), value_score=coalesce(kv_value_score,value_score), last_reviewed=coalesce(kv_last_reviewed,last_reviewed), notes=coalesce(kv_notes,seed_notes) | fields - kv_* seed_notes | table _key dataset_id uhgid ae_name index sourcetype domain cim_datamodel tenant_type declared_tier proposed_tier business_owner technical_owner content_owner backup_owner gate1_normalization gate2_detection gate3_soc cde_priority enterprise_ready schema_version contract_status compliance_flags status retention_days pipeline environment last_reviewed lifecycle_state migration_state value_score notes | outputlookup append=t dc_datasets_lookup
cron_schedule = 0 5 * * *
dispatch.earliest_time = -1m@m
dispatch.latest_time = now
enableSched = 1
disabled = 0

