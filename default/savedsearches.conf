[DC - 99 - Discover UF nodes and their HF path]
description = Discovers every UF talking to the estate via cooked tcpin_connections, and identifies which HF each one flows through by matching the receiving host to dc_infra_nodes (heavy_forwarder type only). Merge-preserves declared_tier/technical_owner/lifecycle_state a human has already set, same pattern as DC-00d - never overwrites tiering with null. Assign Tier 0/1 by hand for AD/DC and other high-severity sources; this search only tracks connectivity, not severity.
