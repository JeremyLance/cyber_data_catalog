[install]
state = enabled
# Not forcing the setup redirect - the dc_github_settings admin_external
# REST endpoint (restmap.conf) is only registered after a full splunkd
# restart, which on Splunk Cloud requires a maintenance window. Leaving
# is_configured=1 lets the app load normally in the meantime; the Setup
# page is still reachable manually via Apps > Manage Apps > "Set up" to
# add the GitHub token once the pending restart completes and the
# endpoint is live. Flip back to 0 only if you want the forced prompt
# again (e.g. for a fresh install elsewhere).
is_configured = 1
build = 8
 
[ui]
is_visible = 1
label = Cyber Data & Detection Catalog
setup_view = dc_setup
 
[launcher]
author = Security Engineering
description = Catalog, data contracts, dependency graph and impact analysis for the AE Splunk ES estate. v0.5.2 adds sourcetype-to-contract reconciliation, Email and DNS CIM scoring, faster dashboards and grouped navigation.
version = 0.5.6
 
[package]
id = cyber_data_catalog
