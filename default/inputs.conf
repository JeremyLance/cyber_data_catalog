[dc_github_file_pull://contracts_master]
github_repo = optum-eis/CIRT_Splunk_SIEM_project
branch = main
file_path = Contracts/contracts_master.csv
target_filename = contracts_master_raw.csv
required_columns = sourcetype,index,contract_issue,notification_sent,cde_approval
python.required = 3.9,3.13
interval = 0 */2 * * *
index = _internal
sourcetype = dc:github_file_pull
# Resumed in v0.7.0 (paused in v0.5.5 while the Splunk-GitHub connection was down).
# DC-37 rebuilds dc_contracts_master.csv from this pull; DC-39 alerts if it stops.
disabled = 0

# To sync another file out of Git later, copy this stanza, give it a new
# name (e.g. dc_github_file_pull://my_other_lookup), and point github_repo /
# file_path / target_filename at the new source. No code changes needed -
# the modular input and the token are shared across every instance.

# ---- v0.7.0: CIRT live-coverage files ----
# Each pull writes straight over the lookup the dashboards read, but only when the
# file has the required columns and at least one data row; otherwise the existing
# lookup is kept and status=validation_failed is logged. An unchanged file is not
# rewritten. Runs every 30 minutes so a CIRT commit shows up within half an hour.
# CIRT keeps both files in optum-eis/CIRT_Splunk_SIEM_project under CIRT/.
# DC-39b alerts if either pull stops succeeding.
[dc_github_file_pull://cirt_approved_detections]
github_repo = optum-eis/CIRT_Splunk_SIEM_project
branch = main
file_path = CIRT/approved_detections.csv
target_filename = dc_cirt_approved_detections.csv
required_columns = alert_name,environment
python.required = 3.9,3.13
interval = */30 * * * *
index = _internal
sourcetype = dc:github_file_pull
disabled = 0

[dc_github_file_pull://cirt_splunk2_allow]
github_repo = optum-eis/CIRT_Splunk_SIEM_project
branch = main
file_path = CIRT/Splunk2.0_Allow.csv
target_filename = dc_splunk2_allow.csv
required_columns = id,name,sourcetype
python.required = 3.9,3.13
interval = */30 * * * *
index = _internal
sourcetype = dc:github_file_pull
disabled = 0

# Optional: keep the auditor's program tracker (lookups/dc_ae_program_seed.csv
# columns) in Git and sync it here. Same validation as the CIRT pulls.
[dc_github_file_pull://auditor_program]
github_repo = optum-eis/CIRT_Splunk_SIEM_project
