[dc_github_file_pull://contracts_master]
github_repo = optum-eis/CIRT_Splunk_SIEM_project
branch = main
file_path = Contracts/contracts_master.csv
target_filename = contracts_master_raw.csv
python.required = 3.9,3.13
interval = 0 */2 * * *
index = _internal
sourcetype = dc:github_file_pull
# PAUSED in v0.5.5: Splunk-GitHub runners are disabled; the contract
# master is maintained by hand. Set to 0 (with DC-37 and DC-39) once back.
disabled = 1

