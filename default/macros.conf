# ============================================================
# Catalog helper macros
# ============================================================

# All security indexes in scope for the catalog. EDIT THIS ONE PLACE.
[dc_scope_indexes]
definition = (index=sec_*)
iseval = 0

# Derive uhgid + dataset_id from the index naming convention
#   sec_<domain>_uhgid-000024   ->  uhgid-000024
#   sec_<domain>_core           ->  core
[dc_key]
definition = eval uhgid=if(match(index,"uhgid-\\d+"), replace(index, ".*?(uhgid-\\d+).*", "\\1"), "core"), dataset_id=uhgid."|".sourcetype
iseval = 0

# Map tier label -> sortable number (0 is most critical)
[dc_tier_num(1)]
args = tierfield
definition = eval tier_num=case($tierfield$="Tier 0",0, $tierfield$="Tier 1",1, $tierfield$="Tier 2",2, $tierfield$="Tier 3",3, $tierfield$="Tier 4",4, 1=1,9)
iseval = 0

# Silence budget by tier, in minutes, used when no explicit contract exists
[dc_default_silence]
definition = eval max_silence_minutes=coalesce(max_silence_minutes, case(declared_tier="Tier 0",30, declared_tier="Tier 1",240, declared_tier="Tier 2",1440, 1=1,4320))
iseval = 0

# ---- v0.2 macros ----

# Feed key = one physical arrival path for a logical dataset.
# environment must be set by the caller (or defaults to the local instance).
[dc_feed_key]
definition = eval environment=coalesce(environment,"saas2"), feed_id=uhgid."|".sourcetype."|".environment
iseval = 0

# Local Splunk environment label. CHANGE THIS PER INSTANCE when you deploy
# the discovery searches to legacy sites during consolidation.
[dc_local_environment]
definition = eval environment="saas2"
iseval = 0

# Drop rows currently inside an approved change window.
# Expects dataset_id, uhgid, pipeline, environment on the pipeline.
[dc_not_suppressed]
definition = eval __now=now() | lookup dc_change_windows_lookup scope_value as dataset_id OUTPUT start_time as w1s end_time as w1e suppress_alerts as w1x | lookup dc_change_windows_lookup scope_value as uhgid OUTPUT start_time as w2s end_time as w2e suppress_alerts as w2x | lookup dc_change_windows_lookup scope_value as pipeline OUTPUT start_time as w3s end_time as w3e suppress_alerts as w3x | lookup dc_change_windows_lookup scope_value as environment OUTPUT start_time as w4s end_time as w4e suppress_alerts as w4x | eval suppressed=if((w1x="yes" AND __now>=w1s AND __now<=w1e) OR (w2x="yes" AND __now>=w2s AND __now<=w2e) OR (w3x="yes" AND __now>=w3s AND __now<=w3e) OR (w4x="yes" AND __now>=w4s AND __now<=w4e),"yes","no") | where suppressed="no" | fields - __now w1* w2* w3* w4* suppressed
iseval = 0

# A feed whose silence is EXPECTED (retired or draining after cutover)
[dc_expected_silence]
definition = eval expected_silence=if(feed_status="retired" OR feed_status="planned" OR (feed_status="draining" AND isnotnull(drain_after) AND now()>drain_after),"yes","no")
iseval = 0

# CIM data model values in the registry are multivalued with " / "
[dc_split_cim]
definition = eval cim_datamodel=replace(cim_datamodel,"\\s*[/|]\\s*","/") | makemv delim="/" cim_datamodel | mvexpand cim_datamodel | where cim_datamodel!="" AND cim_datamodel!="—"
iseval = 0

# Blended cost per GB ingested per year, in dollars.
# EDIT to your contracted rate before enabling DC-70/71.
[dc_cost_per_gb]
definition = 0.08
iseval = 0

# ---- v0.3: index naming standard ----

# Derive the index family and scope from a Splunk index name.
#   sec_firewall_uhgid-000024 -> family sec_firewall, scope tenant
#   sec_email_core            -> family sec_email,    scope core
[dc_index_family]
definition = eval index_lc=lower(index), index_family=if(match(index_lc,"^sec_[a-z0-9_]+_(core|uhgid-\\d+)$"), replace(index_lc,"^(sec_[a-z0-9_]+?)_(core|uhgid-\\d+)$","\\1"), null()), index_scope=case(match(index_lc,"_core$"),"core", match(index_lc,"_uhgid-\\d+$"),"tenant", 1=1,"nonconforming")
iseval = 0

# ---- v0.4: infrastructure nodes ----

# Default silence budget for infra nodes. Tighter than data by design -
# a dead HF/EP is a total outage of everything behind it, not one dataset.
[dc_infra_default_silence]
definition = eval max_silence_minutes=coalesce(max_silence_minutes, case(declared_tier="Tier 0",10, declared_tier="Tier 1",60, 1=1,240))
iseval = 0

# Sourcetype names should be short, plain identifiers. Anything else is
# raw content leaking into the field - the uhgid-000024 HF props bug.
[dc_valid_sourcetype(1)]
args = stfield
definition = eval $stfield$_valid=if(len($stfield$)<=100 AND (match($stfield$,"^[a-zA-Z0-9:_\-\./]+$") OR match($stfield$,"^XmlWinEventLog:[A-Za-z0-9][A-Za-z0-9 /\-]*$")),"yes","no")
iseval = 0

# ---- v0.5.1: referenced by DC-90 max_queue_pct but was never defined ----
# Per-queue capacity in KB used to turn current_size_kb into a percent.
# Splunk default queue maxSize is 500KB; set this to your HFs' actual
# [queue] maxSize from server.conf if you've tuned it.
[dc_queue_capacity_kb]
definition = 1000
iseval = 0

# ---- v0.5.6: contract status from the contract master ----
# The catalog's own contract_status field is never populated. This derives
# status per dataset from dc_contract_master (sourcetype + index):
#   siem_status   SIEM complete     - the SIEM team completed the contract and
#                                     notified CDE (notification_sent=true)
#                 SIEM in progress  - contract row exists, not yet sent to CDE
#                 no contract       - no contract for this sourcetype + index
#   cde_status    CDE approved      - cde_approval=true
#                 pending CDE       - anything else (blank or false)
#   contract_status (kept for DC-50): approved / pending CDE / no contract
[dc_contract_state]
definition = lookup dc_contract_master sourcetype index OUTPUT contract_issue as contract_ticket, cde_approval as contract_cde_approval, notification_sent as contract_notified, notification_date as contract_date | eval contract_ticket=mvindex(contract_ticket,0), siem_status=case(isnull(contract_ticket),"no contract", lower(mvindex(contract_notified,0))="true","SIEM complete", 1=1,"SIEM in progress"), cde_status=case(isnull(contract_ticket),"", lower(mvindex(contract_cde_approval,0))="true","CDE approved", 1=1,"pending CDE"), contract_status=case(cde_status="CDE approved","approved", isnotnull(contract_ticket),"pending CDE", 1=1,"no contract"), contract_date=mvindex(contract_date,0), contract_date=strftime(coalesce(strptime(substr(contract_date,1,19),"%Y-%m-%dT%H:%M:%S"), strptime(contract_date,"%m/%d/%Y %H:%M:%S"), strptime(contract_date,"%m/%d/%Y %H:%M"), strptime(contract_date,"%m/%d/%Y")),"%Y-%m-%d") | fields - contract_cde_approval contract_notified
iseval = 0

# One row per contract in the contract master, with tenant, SIEM completion
# date and CDE wait. Used by the home page and the Command Center.
# notification_date arrives as ISO 8601 from the GitHub sync and as
# MM/DD/YYYY HH:MM:SS when the CSV is edited by hand; both are parsed.
[dc_contracts_enriched]
definition = inputlookup dc_contract_master | eval index=lower(index) | `dc_key` | eval siem_status=if(lower(notification_sent)="true","SIEM complete","SIEM in progress"), cde_status=if(lower(cde_approval)="true","CDE approved","pending CDE"), siem_completed_epoch=coalesce(strptime(substr(notification_date,1,19),"%Y-%m-%dT%H:%M:%S"), strptime(notification_date,"%m/%d/%Y %H:%M:%S"), strptime(notification_date,"%m/%d/%Y %H:%M"), strptime(notification_date,"%m/%d/%Y")), siem_completed=strftime(siem_completed_epoch,"%Y-%m-%d"), days_waiting_on_cde=if(cde_status="pending CDE" AND siem_status="SIEM complete",round((now()-siem_completed_epoch)/86400,0),null())
iseval = 0

# ---- v0.5.9: future-dated log exclusion ----
# Goes inside a tstats WHERE clause, with the same window as its earliest=. Keeps only events
# that were actually indexed inside the window. An event whose _time falls in the window but was
# indexed before it began was future-dated when it arrived (the 2027 syslog and junk sourcetypes),
# so it no longer counts as data arriving now.
[dc_indexed_within(1)]
args = window
definition = _index_earliest=$window$
iseval = 0

# Goes after a tstats ... by index sourcetype. Drops the junk pairs listed in
# dc_future_logs_ignore_seed.csv with ignore_scope=pair. Real sourcetypes on that list
# (ignore_scope=future_events_only) pass through.
[dc_drop_future_log_pairs]
definition = lookup dc_future_logs_ignore index sourcetype OUTPUT ignore_scope as future_log_scope | where isnull(future_log_scope) OR future_log_scope!="pair" | fields - future_log_scope
iseval = 0

# ---- v0.6.0: CIM Command Center reconciliation, shared by the dashboard and DC-102 ----
# One row per index+sourcetype seen in the last 7 days or in the contract master. gap is the
# single most important action. stage: Contract complete (a SIEM contract exists for this
# tenant + sourcetype) or Needs contract. status_bucket: one status per row inside its stage,
# so the tiles in each stage add up to that stage's headline tile.
# Starts with tstats and no pipe: always call it as | `dc_cim_recon(...)` at the very start of a search.
[dc_cim_recon(2)]
args = index_filter, sourcetype_filter
definition = tstats count as events_7d, max(_time) as last_seen where `dc_scope_indexes` `dc_indexed_within(-7d)` index=$index_filter$ sourcetype=$sourcetype_filter$ earliest=-7d by index sourcetype \
| `dc_drop_future_log_pairs` \
| eval discovered=1 \
| append [ | inputlookup dc_contract_master | eval index=lower(index) | search index=$index_filter$ sourcetype=$sourcetype_filter$ | fields index sourcetype ] \
| stats sum(events_7d) as events_7d, max(last_seen) as last_seen, max(discovered) as discovered by index sourcetype \
| fillnull value=0 discovered events_7d \
| `dc_key` \
| `dc_valid_sourcetype(sourcetype)` \
| lookup dc_sourcetype_rejections_lookup sourcetype OUTPUT status as reject_status \
| lookup dc_datasets_lookup dataset_id OUTPUT status as catalog_status, cim_datamodel as catalog_cim \
| lookup dc_datasets_lookup uhgid OUTPUT ae_name \
| eval ae_name=mvindex(ae_name,0) \
| lookup dc_contract_master sourcetype index OUTPUT contract_issue as contract_ticket, cde_approval, datamodels as contract_cim \
| lookup dc_contract_master sourcetype OUTPUT contract_issue as other_ticket \
| join type=left index sourcetype [ | inputlookup dc_cim_coverage_scorecard_lookup | stats max(coverage_score) as cim_score, values(domain) as cim_models_scored by index sourcetype ] \
| eval sourcetype_check=case(sourcetype_valid="no","MALFORMED", reject_status="rejected","REJECTED", 1=1,"ok") \
| eval in_catalog=if(isnotnull(catalog_status),"yes","no") \
| eval contract=case(isnotnull(contract_ticket),"CONTRACTED", isnotnull(other_ticket),"OTHER TENANT ONLY", 1=1,"NO CONTRACT") \
| eval contract_ticket=coalesce(mvindex(contract_ticket,0), mvindex(other_ticket,0)) \
| eval cde_approved=case(contract="NO CONTRACT","", lower(mvindex(cde_approval,0))="true","yes", 1=1,"pending") \
| eval expected_cim=coalesce(if(contract_cim="",null(),mvindex(contract_cim,0)), if(catalog_cim="",null(),catalog_cim)) \
| eval cim_flag=case(isnull(cim_score),"NOT IN SCORED MODELS", cim_score=0,"NO CIM COVERAGE", cim_score<20,"CRITICAL LOW", cim_score<50,"VERY LOW", cim_score<80,"LOW", 1=1,"OK") \
| eval gap=case( \
    sourcetype_check="MALFORMED","Fix sourcetype at the source (props.conf / HEC override)", \
    sourcetype_check="REJECTED","Rejected - AE to stop sending", \
    discovered=0,"Contracted but no data in 7 days - confirm onboarding", \
    contract="NO CONTRACT","Ingested with no contract - create a contract", \
    contract="OTHER TENANT ONLY","Contracted for another tenant only - extend the contract", \
    in_catalog="no","Contracted but not cataloged - add to the catalog seed", \
    cim_flag IN ("NO CIM COVERAGE","CRITICAL LOW","VERY LOW"),"CIM normalization gap", \
    cim_flag="NOT IN SCORED MODELS" AND isnotnull(expected_cim),"Check CIM mapping - expected ".expected_cim, \
    cde_approved="pending","Awaiting CDE approval", \
    1=1,"OK") \
| eval priority=case(gap="OK","OK", match(gap,"^(Fix|Rejected|Ingested)"),"HIGH", 1=1,"MEDIUM") \
| eval last_seen=if(discovered=1,strftime(last_seen,"%Y-%m-%d %H:%M"),"never (7d)"), cim_models_scored=mvjoin(cim_models_scored,", ") \
| eval stage=if(contract="CONTRACTED","Contract complete","Needs contract") \
| eval cim_gap=if(cim_flag IN ("NO CIM COVERAGE","CRITICAL LOW","VERY LOW") OR (cim_flag="NOT IN SCORED MODELS" AND isnotnull(expected_cim)),1,0) \
| eval status_bucket=if(stage="Needs contract", \
    case(sourcetype_check!="ok","Malformed or rejected", contract="NO CONTRACT","Ingested - no contract", 1=1,"Contract extension needed"), \
    case(discovered=0,"Contracted - no data seen", in_catalog="no","Not yet cataloged", cim_gap=1,"CIM normalization gap", cde_approved="pending","Awaiting CDE approval", 1=1,"Fully onboarded")) \
| eval bucket_order=case(status_bucket="Malformed or rejected",1, status_bucket="Ingested - no contract",2, status_bucket="Contract extension needed",3, status_bucket="Contracted - no data seen",4, status_bucket="Not yet cataloged",5, status_bucket="CIM normalization gap",6, status_bucket="Awaiting CDE approval",7, 1=1,8) \
| eval owner=case(bucket_order=1,"Splunk admin / tenant AE", bucket_order=2,"Tenant AE + SIEM validation", bucket_order=3,"SIEM validation", bucket_order=4,"Tenant AE", bucket_order=5,"Data catalog team", bucket_order=6,"Normalization team", bucket_order=7,"CDE", 1=1,"-") \
| eval next_step=case(bucket_order=1,"Fix the sourcetype at the source, or stop sending it", bucket_order=2,"Create a SIEM contract", bucket_order=3,"Extend the existing contract to this tenant", bucket_order=4,"Confirm onboarding and forwarding", bucket_order=5,"Add to the catalog seed", bucket_order=6,"Normalize fields to the expected CIM data model", bucket_order=7,"CDE sign-off on the contract", 1=1,"None - done") \
| fields stage status_bucket bucket_order owner next_step uhgid index sourcetype ae_name priority events_7d last_seen discovered sourcetype_check in_catalog contract contract_ticket cde_approved expected_cim cim_models_scored cim_score cim_flag gap
iseval = 0
