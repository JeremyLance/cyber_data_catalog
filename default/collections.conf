# ============================================================
# Cyber Data & Detection Catalog - KV Store collections
# ============================================================

# --- 1. The registry of every (tenant x index x sourcetype) dataset -----
[dc_datasets]
enforceTypes = false
field.dataset_id = string
field.uhgid = string
field.ae_name = string
field.index = string
field.sourcetype = string
field.domain = string
field.cim_datamodel = string
field.tenant_type = string
field.declared_tier = string
field.proposed_tier = string
field.business_owner = string
field.technical_owner = string
field.content_owner = string
field.backup_owner = string
field.gate1_normalization = string
field.gate2_detection = string
field.gate3_soc = string
field.cde_priority = string
field.enterprise_ready = string
field.schema_version = string
field.contract_status = string
field.compliance_flags = string
field.status = string
field.retention_days = number
field.pipeline = string
field.environment = string
field.last_reviewed = time
field.lifecycle_state = string
field.migration_state = string
field.value_score = number
field.notes = string
accelerated_fields.dc_ds_id = {"dataset_id": 1}
accelerated_fields.dc_ds_st = {"sourcetype": 1, "uhgid": 1}

# --- 2. Data contract: what we promised this dataset would do ----------
[dc_contracts]
enforceTypes = false
field.dataset_id = string
field.tier = string
field.schema_version = string
field.expected_events_min = number
field.expected_events_max = number
field.max_silence_minutes = number
field.max_latency_seconds = number
field.sla_response_minutes = number
field.notify_channel = string
field.approved_by = string
field.approved_date = time
field.contract_url = string
accelerated_fields.dc_ct_id = {"dataset_id": 1}

# --- 3. Field-level schema library (the "contract fields") -------------
[dc_schema_fields]
enforceTypes = false
field.sourcetype = string
field.schema_version = string
field.field_name = string
field.cim_field = string
field.data_type = string
field.required = string
field.min_coverage_pct = number
field.sensitivity = string
field.description = string
field.example = string
accelerated_fields.dc_sf = {"sourcetype": 1, "schema_version": 1}

# --- 4. Schema version history (append-only) ---------------------------
[dc_schema_versions]
