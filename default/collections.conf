# ============================================================
# v0.4 — Splunk infrastructure tracking: Edge Processors and
#        Heavy Forwarders as first-class, Tier-0-eligible assets.
#        These aren't data - they're the pipe the data flows
#        through. If one goes down, EVERYTHING behind it goes
#        dark at once, which is a different failure shape than
#        a single dataset outage and needs its own catalog.
# ============================================================

